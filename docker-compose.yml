# Full stack: PostgreSQL + FastAPI backend + React dashboard (nginx) + n8n.
#   docker compose up -d --build
# Dashboard: http://localhost:${FRONTEND_PORT:-3000}  API docs: http://localhost:${BACKEND_PORT:-8000}/docs
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      PUBLIC_APP_URL: http://localhost:${FRONTEND_PORT:-3000}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://localhost:5173
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/London}
      N8N_SECURE_COOKIE: "false"   # local development only
      # Read by the workflows via $env (see automation/README.md)
      RECRUITMENT_API_URL: http://backend:8000
      RECRUITER_EMAIL: ${RECRUITER_EMAIL:-recruiter@example.com}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/workflows:/workflows:ro

volumes:
  pgdata:
  n8n_data:
  uploads:
